[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nna"
version = "1.0.0"
description = "Arytmetyki generowane funkcyjnie (rachunek nie-Newtonowski): modele, wizualizacje, zastosowania"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maciej Szulia" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["scipy>=1.10", "matplotlib>=3.7", "seaborn>=0.12", "pytest>=7"]

[project.scripts]
nna-figures = "nna.figures:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
