name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testy (aksjomaty ciala + zgodnosc wzorow)
        run: pytest -v

      - name: Wykresy
        run: python -m nna.figures

      - name: Artefakt z wykresami
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: docs/figures/*.png
